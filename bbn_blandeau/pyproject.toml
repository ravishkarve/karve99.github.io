[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bbn"
version = "1.0.0"
description = "Broadband noise of rotors and contra-rotating open rotors after V. P. Blandeau's thesis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
bbn = "bbn.cli:main"

[tool.setuptools]
packages = ["bbn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
